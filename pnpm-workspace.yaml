# Only install package versions that have been public for at least 5 days
# (in minutes), so compromised releases are usually caught and pulled first.
minimumReleaseAge: 7200

# Install scripts are blocked unless listed here (strictDepBuilds is on by default).
allowBuilds:
  # Only verifies its binary, which ships as a separate platform package.
  esbuild: false

overrides:
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  fast-uri@>=3.1.3 <3.1.9: ^3.1.9
  sharp@<0.35.5: ^0.35.5
  smol-toml@<=1.8.0: ^1.9.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@>=8.0.0 <8.12.2: ^8.12.2
  vite@>=8.3.0 <=8.3.2: ^8.3.3
  zod@<4.6.6: ^4.6.6
