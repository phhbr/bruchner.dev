# Build and test. Runs on pull requests and as the first stage of deploy.yml.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit, tag or branch to build (empty = the triggering commit)
        type: string
        default: ''

permissions: {}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0 # full history: sitemap dates come from git

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # astro check + build + inline-code guard
      - run: pnpm run build

      - name: Record the commit being deployed
        run: git rev-parse HEAD > dist/version.txt

      - run: pnpm exec playwright install --with-deps chromium

      # Smoke tests, axe and the CSP test, against the production build
      - run: pnpm test

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --root-dir ${{ github.workspace }}/dist --index-files index.html --no-progress 'dist/**/*.html'
          fail: true

      - name: Test the edge Caddy config
        run: ./deploy/test-caddy.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          include-hidden-files: true # dist/.well-known/security.txt
          if-no-files-found: error
          retention-days: 7

  # Report only: an advisory in a build-time dependency must not block a
  # content fix such as an Impressum correction.
  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level=high
